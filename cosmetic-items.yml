# ─────────────────────────────────────────────────────────────────────────────
#  치장 목록  (이것이 원본이다)
#
#  여기를 고치고 make-cosmetics.ps1 을 돌리면 서버의 치장 설정이 통째로 다시 만들어진다.
#
#  한 덩어리의 뜻
#    맨 윗줄 : 겹치지 않는 구분용 이름 (권한 이름에도 쓰인다)
#    이름  : 게임 안에서 보이는 이름
#    부위  : 머리 / 상체 / 손 / 풍선  중 하나
#    모양  : 리소스팩 안의 모양 이름 (폴더이름:파일이름)
#    그릇  : 생략 가능. 모양을 입힐 바탕 아이템 (기본값 가죽 말갑옷)
#
#  몸의 어디에 놓일지는 리소스팩의 모양 파일이 갖고 있으므로 여기에 위치 값은 없다.
#
#  다만 상체(등·어깨) 치장은 받아온 모양들이 예전에 쓰던 다른 치장 프로그램 기준으로
#  높이가 잡혀 있어서, 지금 프로그램에 그대로 쓰면 발밑까지 내려간다.
#  아래 '상체높이올림' 값만큼 전부 위로 올려서 리소스팩에 넣는다.
#  (숫자가 클수록 위로 올라간다. 16이 대략 한 칸의 3분의 2쯤)
#  특정 치장 하나만 따로 조절하고 싶으면 그 덩어리에 '높이올림: 숫자' 를 적으면 된다.
# ─────────────────────────────────────────────────────────────────────────────

