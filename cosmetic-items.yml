# ─────────────────────────────────────────────────────────────────────────────
#  치장 목록
#
#  여기에 적힌 것이 "/치장" 창과 치장 뽑기에 그대로 들어간다.
#  새 치장을 늘리려면 아래 형식으로 한 덩어리를 더 적으면 된다. 플러그인을
#  다시 만들 필요는 없다. (서버에서 "/치장설정"을 열면 이 파일을 다시 읽는다.)
#
#  한 덩어리의 뜻
#    맨 윗줄(diver_hat 같은 것) : 겹치지 않는 구분용 이름. 아무거나 좋다.
#    이름  : 게임 안에서 보이는 이름
#    부위  : 머리 / 상체 / 손  중 하나
#    모양  : 리소스팩 안의 모양 이름 (폴더이름:파일이름)
#    그릇  : 생략 가능. 모양을 입힐 바탕 아이템 (기본값 가죽 말갑옷)
#
#  몸의 어디에 놓일지는 리소스팩의 모양 파일이 갖고 있으므로 여기에 위치 값은 없다.
#  자리가 안 맞으면 모양 파일 쪽을 고친다.
#
#  이름과 부위는 게임 안에서 "/치장설정" 창으로 바꾸는 편이 편하다.
#  바꾸면 이 파일도 함께 고쳐진다.
# ─────────────────────────────────────────────────────────────────────────────

