# ─────────────────────────────────────────────────────────────────────────────
#  도구 치장 목록  (이것이 원본이다)
#
#  여기를 고치고 toolskin-pack.ps1 을 돌리면
#  리소스팩(DB.zip)과 서버의 도구 치장 목록이 함께 다시 만들어진다.
#
#  한 덩어리의 뜻
#    맨 윗줄 : 겹치지 않는 구분용 이름 (권한 이름에도 쓰인다)
#    이름     : 게임 안에서 보이는 이름
#    종류     : 곡괭이 / 도끼 / 괭이 / 낚싯대 / 검 / 활  중 하나
#    모양     : 손에 들었을 때의 생김새
#    던진모양 : 낚싯대만 — 찌를 던진 동안의 생김새 (없으면 생략)
#    당김모양 : 활만 — 시위를 당기는 세 단계의 생김새를 빈칸으로 나눠 적는다
# ─────────────────────────────────────────────────────────────────────────────

